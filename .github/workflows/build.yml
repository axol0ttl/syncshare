name: Build and release SyncShare

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and test Chrome extension
        run: npm test
      - name: Package Chrome extension
        working-directory: dist
        run: zip -qr "$RUNNER_TEMP/syncshare-chrome.zip" .
      - run: npm run build:firefox
      - name: Package Firefox extension
        working-directory: dist
        run: zip -qr "$RUNNER_TEMP/syncshare-firefox.xpi" .
      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            ${{ runner.temp }}/syncshare-chrome.zip
            ${{ runner.temp }}/syncshare-firefox.xpi
          if-no-files-found: error
          retention-days: 5

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extensions
          path: packages
      - name: Publish both browser packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          assets=(packages/syncshare-chrome.zip packages/syncshare-firefox.xpi)
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            flags=(--latest)
          else
            flags=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false "${flags[@]}"
            fi
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "SyncShare · Build $GITHUB_RUN_NUMBER" \
              --notes "Сборка из ветки \`$GITHUB_REF_NAME\`, коммит \`$GITHUB_SHA\`." "${flags[@]}"
          fi
